[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestor-comercial"
version = "0.1.0"
description = "PDV desktop offline em Python — reestruturação do Gestor Comercial para o food truck"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "python-escpos>=3.1",
    # Impressão pelo tipo de conexão WINDOWS (fila de impressão instalada) usa
    # escpos.printer.Win32Raw, que exige pywin32. O marcador de plataforma
    # existe porque o pacote só instala no Windows — e o app roda em Windows,
    # mas os testes precisam poder rodar em qualquer lugar. Sem ele instalado,
    # hardware/impressora_escpos.py degrada com aviso em português em vez de
    # quebrar. pyusb e pyserial (tipos USB e SERIAL) ficaram de fora de
    # propósito: são extras opcionais do python-escpos e só entram quando a
    # impressora física chegar e o cabo dela for conhecido.
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
gestor-comercial = "gestor_comercial.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pyinstaller>=6.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
